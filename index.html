<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TravelTicket</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Leaflet (mapas) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <!-- Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <!-- Tu CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container py-4">
    <h1 class="mb-4">✈️ TravelTicket</h1>

    <div class="row g-3">
      <div class="col-md-3">
        <input id="cliente" class="form-control" placeholder="Cliente">
      </div>
      <div class="col-md-3">
        <input id="country" class="form-control" placeholder="País (ej. Mexico)">
      </div>
      <div class="col-md-2">
        <input id="fecha" type="date" class="form-control">
      </div>
      <div class="col-md-2">
        <input id="personas" type="number" class="form-control" placeholder="Viajeros" value="1">
      </div>
      <div class="col-md-2">
        <input id="costo" type="number" class="form-control" placeholder="Costo USD" value="100">
      </div>
    </div>

    <div class="mt-3">
      <button class="btn btn-primary" onclick="buscarDestino()">Buscar destino</button>
      <button class="btn btn-success" onclick="generarPDF()">Generar PDF</button>
    </div>

    <div id="info" class="row mt-4"></div>
    <div id="map"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Tus scripts -->
  <script src="js/app.js"></script>
  <script src="js/pdf.js"></script>
</body>
</html>
